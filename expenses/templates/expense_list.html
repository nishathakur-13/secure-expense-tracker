<!DOCTYPE html>
<html>
<head>
    <title>My Expenses</title>
</head>
<body>
    <h1>My Expenses</h1>
    <p>Logged in as {{ user.username }}</p>
    <p><a href="/add/">Add expense</a></p>

    <table border="1" cellpadding="5">
        <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
        </tr>
        {% for e in expenses %}
        <tr>
            <td>{{ e.description }}</td>
            <td>{{ e.amount }}</td>
            <td>{{ e.category }}</td>
            <td>{{ e.date }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No expenses yet.</td></tr>
        {% endfor %}
    </table>

    <p><strong>Total: {{ total|default:0 }}</strong></p>

    <form method="post" action="/logout/">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>
</body>
</html>
